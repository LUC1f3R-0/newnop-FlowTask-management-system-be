name: Test NestJS Docker on EC2

on:
  push:
    branches:
      - main

jobs:
  test-nest-docker:
    runs-on: self-hosted

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Debug checked out repo
        run: |
          echo "Current directory:"
          pwd

          echo "Root files:"
          ls -la

          echo "Tracked files from Git:"
          git ls-files

          echo "Find project files:"
          find . -maxdepth 4 -type f | sort

      - name: Verify ci-docker-test folder exists
        run: |
          test -d ./ci-docker-test
          test -f ./ci-docker-test/Dockerfile
          test -f ./ci-docker-test/package.json
          test -f ./ci-docker-test/tsconfig.json

      - name: Check Docker
        run: |
          docker --version
          docker compose version

      - name: Create production env file from GitHub Secrets
        run: |
          cat > /tmp/ci-docker-test.env <<EOF
          NODE_ENV=production
          APP_PORT=3000
          TEST_MESSAGE=${{ secrets.TEST_MESSAGE }}
          EOF

      - name: Stop old test container
        run: |
          docker rm -f nest-ci-test || true

      - name: Build NestJS test image
        run: |
          docker build -t nest-ci-test ./ci-docker-test

      - name: Run NestJS test container
        run: |
          docker run -d \
            --name nest-ci-test \
            --env-file /tmp/ci-docker-test.env \
            -p 8088:3000 \
            nest-ci-test

      - name: Test NestJS health endpoint
        run: |
          sleep 5
          curl -f http://localhost:8088/api/health

      - name: Show container logs
        if: always()
        run: |
          docker logs nest-ci-test || true

      - name: Remove temporary env file
        if: always()
        run: |
          rm -f /tmp/ci-docker-test.env