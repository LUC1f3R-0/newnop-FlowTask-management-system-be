name: Deploy FlowTask Backend to Lambda

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: newnop-flowtask-backend-lambda
  LAMBDA_FUNCTION_NAME: newnop-flowtask-backend-lambda
  DOCKERFILE_PATH: ./Dockerfile.lambda
  BUILD_CONTEXT: .

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Verify backend project files
        run: |
          pwd
          ls -la

          test -f ./Dockerfile.lambda
          test -f ./package.json
          test -f ./package-lock.json
          test -f ./tsconfig.json
          test -f ./tsconfig.build.json
          test -f ./nest-cli.json
          test -f ./prisma/schema.prisma
          test -f ./prisma.config.ts
          test -f ./src/main.ts

          echo "Backend files verified"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Prepare image variables
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_REGISTRY="$ACCOUNT_ID.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          IMAGE_TAG="${{ github.sha }}"
          IMAGE_URI="$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG"

          echo "ACCOUNT_ID=$ACCOUNT_ID" >> $GITHUB_ENV
          echo "ECR_REGISTRY=$ECR_REGISTRY" >> $GITHUB_ENV
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Create ECR repository if missing
        run: |
          if aws ecr describe-repositories \
            --repository-names "${{ env.ECR_REPOSITORY }}" \
            --region "${{ env.AWS_REGION }}" > /dev/null 2>&1; then
            echo "ECR repository already exists"
          else
            aws ecr create-repository \
              --repository-name "${{ env.ECR_REPOSITORY }}" \
              --region "${{ env.AWS_REGION }}"
          fi

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region "${{ env.AWS_REGION }}" | \
          docker login \
            --username AWS \
            --password-stdin "$ECR_REGISTRY"

      - name: Build Lambda image
        run: |
          docker build \
            --platform linux/amd64 \
            -f "${{ env.DOCKERFILE_PATH }}" \
            -t "$IMAGE_URI" \
            "${{ env.BUILD_CONTEXT }}"

      - name: Push Lambda image to ECR
        run: |
          docker push "$IMAGE_URI"

      - name: Create Lambda function if missing
        run: |
          if aws lambda get-function \
            --function-name "${{ env.LAMBDA_FUNCTION_NAME }}" \
            --region "${{ env.AWS_REGION }}" > /dev/null 2>&1; then
            echo "Lambda function already exists"
          else
            aws lambda create-function \
              --function-name "${{ env.LAMBDA_FUNCTION_NAME }}" \
              --package-type Image \
              --code ImageUri="$IMAGE_URI" \
              --role "${{ secrets.LAMBDA_EXECUTION_ROLE_ARN }}" \
              --timeout 30 \
              --memory-size 1024 \
              --architectures x86_64 \
              --region "${{ env.AWS_REGION }}"
          fi

      - name: Wait for Lambda to become active
        run: |
          aws lambda wait function-active \
            --function-name "${{ env.LAMBDA_FUNCTION_NAME }}" \
            --region "${{ env.AWS_REGION }}"

      - name: Update Lambda image
        run: |
          aws lambda update-function-code \
            --function-name "${{ env.LAMBDA_FUNCTION_NAME }}" \
            --image-uri "$IMAGE_URI" \
            --region "${{ env.AWS_REGION }}"

      - name: Wait for Lambda image update
        run: |
          aws lambda wait function-updated \
            --function-name "${{ env.LAMBDA_FUNCTION_NAME }}" \
            --region "${{ env.AWS_REGION }}"

      - name: Build Lambda environment file
        run: |
          jq -n \
            --arg NODE_ENV "production" \
            --arg PORT "3000" \
            --arg APP_PORT "3000" \
            --arg AWS_LWA_PORT "3000" \
            --arg DATABASE_URL "${{ secrets.DATABASE_URL }}" \
            --arg DB_SSL "${{ secrets.DB_SSL }}" \
            --arg DB_LOGGING "${{ secrets.DB_LOGGING }}" \
            --arg CORS_ORIGINS "${{ secrets.CORS_ORIGINS }}" \
            --arg X_API_KEY "${{ secrets.X_API_KEY }}" \
            --arg JWT_ACCESS_SECRET "${{ secrets.JWT_ACCESS_SECRET }}" \
            --arg JWT_REFRESH_SECRET "${{ secrets.JWT_REFRESH_SECRET }}" \
            --arg SMTP_HOST "${{ secrets.SMTP_HOST }}" \
            --arg SMTP_PORT "${{ secrets.SMTP_PORT }}" \
            --arg SMTP_SECURE "${{ secrets.SMTP_SECURE }}" \
            --arg SMTP_USER "${{ secrets.SMTP_USER }}" \
            --arg SMTP_PASS "${{ secrets.SMTP_PASS }}" \
            '{
              Variables: {
                NODE_ENV: $NODE_ENV,
                PORT: $PORT,
                APP_PORT: $APP_PORT,
                AWS_LWA_PORT: $AWS_LWA_PORT,
                DATABASE_URL: $DATABASE_URL,
                DB_SSL: $DB_SSL,
                DB_LOGGING: $DB_LOGGING,
                CORS_ORIGINS: $CORS_ORIGINS,
                X_API_KEY: $X_API_KEY,
                JWT_ACCESS_SECRET: $JWT_ACCESS_SECRET,
                JWT_REFRESH_SECRET: $JWT_REFRESH_SECRET,
                SMTP_HOST: $SMTP_HOST,
                SMTP_PORT: $SMTP_PORT,
                SMTP_SECURE: $SMTP_SECURE,
                SMTP_USER: $SMTP_USER,
                SMTP_PASS: $SMTP_PASS
              }
            }' > lambda-env.json

          cat lambda-env.json | jq '.Variables | keys'

      - name: Update Lambda environment variables
        run: |
          aws lambda update-function-configuration \
            --function-name "${{ env.LAMBDA_FUNCTION_NAME }}" \
            --environment file://lambda-env.json \
            --region "${{ env.AWS_REGION }}"

      - name: Wait for Lambda config update
        run: |
          aws lambda wait function-updated \
            --function-name "${{ env.LAMBDA_FUNCTION_NAME }}" \
            --region "${{ env.AWS_REGION }}"

      - name: Build Function URL CORS file
        run: |
          jq -n \
            --arg origin "${{ secrets.CORS_ORIGINS }}" \
            '{
              AllowOrigins: [$origin],
              AllowMethods: ["GET", "POST", "PUT", "PATCH", "DELETE"],
              AllowHeaders: [
                "content-type",
                "authorization",
                "x-api-key",
                "x-request-id",
                "idempotency-key"
              ],
              ExposeHeaders: ["x-request-id"],
              AllowCredentials: true,
              MaxAge: 86400
            }' > function-url-cors.json

          cat function-url-cors.json

      - name: Create or update Lambda Function URL
        run: |
          if aws lambda get-function-url-config \
            --function-name "${{ env.LAMBDA_FUNCTION_NAME }}" \
            --region "${{ env.AWS_REGION }}" > /dev/null 2>&1; then
            aws lambda update-function-url-config \
              --function-name "${{ env.LAMBDA_FUNCTION_NAME }}" \
              --auth-type NONE \
              --cors file://function-url-cors.json \
              --region "${{ env.AWS_REGION }}"
          else
            aws lambda create-function-url-config \
              --function-name "${{ env.LAMBDA_FUNCTION_NAME }}" \
              --auth-type NONE \
              --cors file://function-url-cors.json \
              --region "${{ env.AWS_REGION }}"
          fi

      - name: Add public Function URL invoke permission
        run: |
          aws lambda add-permission \
            --function-name "${{ env.LAMBDA_FUNCTION_NAME }}" \
            --statement-id FunctionUrlPublicAccess \
            --action lambda:InvokeFunctionUrl \
            --principal "*" \
            --function-url-auth-type NONE \
            --region "${{ env.AWS_REGION }}" \
          || true

      - name: Add public Function invoke permission through URL
        run: |
          aws lambda add-permission \
            --function-name "${{ env.LAMBDA_FUNCTION_NAME }}" \
            --statement-id FunctionUrlPublicInvokeFunction \
            --action lambda:InvokeFunction \
            --principal "*" \
            --invoked-via-function-url \
            --region "${{ env.AWS_REGION }}" \
          || true

      - name: Print Function URL
        run: |
          FUNCTION_URL=$(aws lambda get-function-url-config \
            --function-name "${{ env.LAMBDA_FUNCTION_NAME }}" \
            --query FunctionUrl \
            --output text \
            --region "${{ env.AWS_REGION }}")

          echo "FUNCTION_URL=$FUNCTION_URL" >> $GITHUB_ENV
          echo "Lambda Function URL:"
          echo "$FUNCTION_URL"

      - name: Test Lambda health endpoint
        run: |
          sleep 10
          curl -i "${FUNCTION_URL}api/health" || true