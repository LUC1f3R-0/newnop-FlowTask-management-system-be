name: Test Public NestJS Docker on EC2

on:
  push:
    branches:
      - main

jobs:
  test-public-nest-docker:
    runs-on: self-hosted

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check Docker
        run: |
          docker --version
          docker compose version

      - name: Verify ci-docker-test folder exists
        run: |
          test -d ./ci-docker-test
          test -f ./ci-docker-test/Dockerfile
          test -f ./ci-docker-test/package.json
          test -f ./ci-docker-test/tsconfig.json

      - name: Create production env file from GitHub Secrets
        run: |
          cat > /tmp/ci-docker-test.env <<EOF
          NODE_ENV=production
          PORT=3000
          APP_PORT=3000
          SOMETHING=${{ secrets.SOMETHING }}
          EOF

      - name: Stop old test container
        run: |
          docker rm -f nest-ci-test || true

      - name: Build NestJS test image
        run: |
          docker build -t nest-ci-test ./ci-docker-test

      - name: Run NestJS test container publicly on port 80
        run: |
          docker run -d \
            --name nest-ci-test \
            --env-file /tmp/ci-docker-test.env \
            -p 80:3000 \
            nest-ci-test

      - name: Test from inside EC2
        run: |
          sleep 5
          curl -f http://localhost/

      - name: Show container logs
        if: always()
        run: |
          docker logs nest-ci-test || true

      - name: Remove temporary env file
        if: always()
        run: |
          rm -f /tmp/ci-docker-test.env